name: Linting, testing, building
on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
jobs:
    pipline:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [19.x]
        steps:
            - uses: actions/checkout@v2
              with:
                  fetch-depth: 0
            - name: Starting Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node_version: ${{ matrix.node-version }}

            - name: install modules
              run: make install

            - name: build production project
              run: make prod
              if: always()

            - name: typescript linting
              run: make lint
              if: always()

            - name: css linting
              run: make stylelint
              if: always()

            - name: unit testing
              run: make test
              if: always()

            # - name: ui testing
            #   run: make chrom
            #   if: always()
